<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סוכני AI פרואקטיביים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="חמש פעולות יזומות של סוכני AI במודל MRFPS: סימנים מוקדמים, בדיקת הנחות, חיבור מידע, מה אם, ותיקון מוקדם">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
<style>
/* Layout: "ספר מבצעים" — אינדקס קבוע בצד ימין, גיליון עבודה במרכז; כל שלב הוא דף בגיליון */
:root{
  --bg:#f3f5f7; --sheet:#ffffff; --ink:#15202b; --muted:#5b6777; --line:#d8dee6; --soft:#eaeef2;
  --accent:#0b6a66; --accent-soft:#e1f0ee; --accent-ink:#ffffff;
  --ok:#2f7d3b; --warn:#b07a00; --orange:#c25a12; --bad:#b3261e;
  --f-display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --f-body:"IBM Plex Sans Hebrew","Assistant","Arial",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --sheet:#151d25; --ink:#e7edf3; --muted:#9aa7b6; --line:#2a3642; --soft:#1c2630;
  --accent:#4fbcb3; --accent-soft:#163533; --accent-ink:#06201e;
  --ok:#6cc27a; --warn:#e2b23c; --orange:#f08a4b; --bad:#ef6b62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --sheet:#151d25; --ink:#e7edf3; --muted:#9aa7b6; --line:#2a3642; --soft:#1c2630;
  --accent:#4fbcb3; --accent-soft:#163533; --accent-ink:#06201e;
  --ok:#6cc27a; --warn:#e2b23c; --orange:#f08a4b; --bad:#ef6b62; color-scheme:dark}

*{box-sizing:border-box}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* index */
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;max-height:calc(100vh - 40px);overflow:auto}
@media (max-width:860px){nav.index{position:static;max-height:none}}
.brand{font-family:var(--f-display);font-weight:900;font-size:1.35rem;line-height:1.2;margin:0 0 4px}
.brand-sub{color:var(--muted);font-size:.82rem;margin:0 0 14px}
.btn.navtoggle{display:none;width:100%;margin-top:4px;text-align:center}
main:focus{outline:none}
@media (max-width:860px){.btn.navtoggle{display:block}.navlist.closed{display:none}}
.navlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.navlist a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:.93rem}
.navlist a:hover{background:var(--soft)}
.navlist a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.navlist a[aria-current="page"] .code{color:inherit;opacity:.85}
.navgroup{margin-top:10px;font-size:.72rem;letter-spacing:.06em;color:var(--muted);padding:0 8px;font-weight:600}
.navlist .sub a{padding-right:22px;font-size:.88rem}
.code{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);min-width:1.6em}

/* sheet */
main{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3.5vw,40px);min-width:0}
.eyebrow{font-size:.78rem;letter-spacing:.07em;color:var(--accent);font-weight:700;margin:0 0 6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:900}
h2{font-size:1.45rem;font-weight:700;margin-top:30px;margin-bottom:10px}
h3{font-size:1.12rem;font-weight:700;margin-bottom:6px}
.lead{font-size:1.12rem;color:var(--ink);max-width:62ch;margin:12px 0 0}
p{max-width:68ch;margin:8px 0}
.muted{color:var(--muted)}
ul.clean{margin:6px 0;padding-right:20px}
ul.clean li{margin:4px 0;max-width:66ch}

.question{margin-top:18px;border-right:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.en{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);direction:ltr;unicode-bidi:isolate;margin-inline-start:8px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid2,.grid4{grid-template-columns:minmax(0,1fr)}}

.panel{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel h3{display:flex;gap:8px;align-items:center}
.who{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.who.ai{border-color:var(--accent);color:var(--accent)}

.chapter{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.chapter:hover,.chapter:focus-visible{border-color:var(--accent)}
.chapter .ltr{font-family:var(--f-display);font-size:2rem;font-weight:900;color:var(--accent);line-height:1}
.chapter .q{font-weight:600}
.chapter .stages{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);text-decoration:none;background:var(--sheet)}
a.chip:hover{border-color:var(--accent);color:var(--accent)}

/* ribbon of 12 */
.ribbon{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-top:10px}
.ribbon a{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;min-width:92px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-decoration:none;color:var(--ink);background:var(--sheet)}
.ribbon a:hover{border-color:var(--accent)}
.ribbon .n{font-family:var(--f-mono);font-size:.72rem;color:var(--accent)}
.ribbon .t{font-size:.86rem;font-weight:600;line-height:1.3}
.ribbon .sep{align-self:center;color:var(--muted);flex:0 0 auto}

.loops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
@media (max-width:700px){.loops{grid-template-columns:minmax(0,1fr)}}
.loop .flow{font-size:.86rem;color:var(--muted);margin-top:6px}

.example{margin-top:24px;border:1px dashed var(--accent);border-radius:var(--r);padding:14px 18px;background:color-mix(in srgb,var(--accent-soft) 45%,var(--sheet))}
.example .tag{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.tablewrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:right;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.82rem}
td.num{font-variant-numeric:tabular-nums}
.gap{color:var(--bad);font-weight:700}

.status{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.s-ok{background:var(--ok)}.s-warn{background:var(--warn)}.s-or{background:var(--orange)}.s-bad{background:var(--bad)}

.layers{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.layer{font-size:.82rem;background:var(--soft);border-radius:6px;padding:3px 9px}

.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1.5px dotted var(--accent);cursor:help}
.term:focus-visible,.chapter:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#pop{position:fixed;z-index:20;max-width:320px;background:var(--ink);color:var(--sheet);padding:10px 12px;border-radius:8px;font-size:.88rem;line-height:1.5;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
#pop b{display:block;margin-bottom:2px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{display:inline-flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:var(--ink);text-decoration:none;background:var(--sheet);font:inherit;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn small{color:var(--muted);font-size:.75rem}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.rule .k{font-family:var(--f-display);font-weight:900;color:var(--accent);font-size:1.3rem;min-width:1.4em}
dl.gloss{display:grid;grid-template-columns:minmax(140px,220px) minmax(0,1fr);gap:0;margin:10px 0}
dl.gloss dt,dl.gloss dd{padding:9px 0;border-bottom:1px solid var(--line);margin:0}
dl.gloss dt{font-weight:700;padding-left:14px}
@media (max-width:560px){dl.gloss{grid-template-columns:minmax(0,1fr)}dl.gloss dt{border-bottom:0;padding-bottom:0}}
footer{max-width:1180px;margin:16px auto 0;color:var(--muted);font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:no-preference){main{animation:in .25s ease-out}@keyframes in{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</style>
</head>
<body>
<style>
.lbl{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;margin-inline-end:6px;vertical-align:1px;border:1px solid currentColor;white-space:nowrap}
.lbl.ev{color:var(--ok)} .lbl.inf{color:var(--accent)} .lbl.as{color:var(--warn)} .lbl.un{color:var(--muted)} .lbl.rec{color:var(--orange)}
.alert{margin-top:12px;border:1px solid var(--line);border-top:4px solid var(--warn);border-radius:var(--r);padding:14px 16px;background:var(--sheet)}
.alert.hi{border-top-color:var(--bad)}
.alert .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.alert .hd b{font-family:var(--f-display);font-size:1.12rem}
.alert .meta{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.alert ul{margin:6px 0 0;padding-inline-start:0;list-style:none}
.alert li{margin:6px 0;line-height:1.5}
.alert .ask{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-weight:600}
ol.steps{list-style:none;padding:0;margin:10px 0 0;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
ol.steps li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:.85rem}
.agents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:620px){.agents{grid-template-columns:minmax(0,1fr)}}
.agent{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:0}
.agent .nm{font-weight:700}
.agent .en{margin:0;display:block;margin-top:2px}
.agent p{margin:6px 0 0;font-size:.92rem}
.trig{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.trig span{font-size:.84rem;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--soft)}
.human{margin-top:14px;border:1px solid var(--line);border-right:4px solid var(--ink);border-radius:0 8px 8px 0;padding:12px 16px}
.limit{margin-top:12px;border-right:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--sheet));padding:10px 16px;border-radius:0 8px 8px 0}
.cycle{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.cycle span{border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:4px 12px;font-weight:600;font-size:.9rem}
.cycle i{color:var(--muted);font-style:normal}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.filters button{font:inherit;font-size:.84rem;border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--sheet);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mod{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-top:10px}
.mod h3{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.mod .n{font-family:var(--f-mono);color:var(--accent);font-size:.85rem}
.mod p{margin:6px 0}
.chain{margin-top:12px}
.chain .st{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);margin-top:8px;transition:opacity .25s}
.chain .st.off{opacity:.25}
.chain .st .ic{flex:0 0 34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-mono);font-size:.8rem}
.chain .st.hum .ic{background:var(--ink);color:var(--sheet)}
.chain .st p{margin:2px 0 0;font-size:.93rem}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.turn{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-top:8px}
.turn .who2{font-weight:700;font-size:.85rem;color:var(--accent)}
.turn.crit .who2{color:var(--bad)} .turn.hist .who2{color:var(--warn)} .turn.arb{border-color:var(--ink)} .turn.arb .who2{color:var(--ink)}
.turn p{margin:4px 0 0}
.week{margin-top:10px}
.day{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.day .d{font-weight:700;font-family:var(--f-display)}
.day .ev{margin:0 0 6px}
@media (max-width:520px){.day{grid-template-columns:minmax(0,1fr);gap:2px}}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:760px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.ladder{grid-template-columns:minmax(0,1fr)}}
.ladder div{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;border-top-width:4px}
.ladder b{display:block;margin-bottom:4px}
.ladder p{margin:0;font-size:.88rem}
.vs td:first-child{font-weight:600;white-space:nowrap}
.pq{font-family:var(--f-display);font-size:1.3rem;font-weight:700;text-align:center;margin:22px auto 6px;max-width:40ch}
</style>

<div class="wrap">
  <nav class="index" aria-label="ניווט בדף">
    <p class="brand">סוכני AI פרואקטיביים</p>
    <p class="brand-sub">מה הסוכנים עושים לפני שמישהו שואל</p>
    <button class="btn navtoggle" id="navtoggle" type="button" aria-expanded="false" aria-controls="navlist">הצג את תוכן העניינים</button>
    <ul class="navlist closed" id="navlist"></ul>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<footer>הדוגמאות בדף הן המחשה של עבודת המודל בבית חולים אזורי. המספרים בהן בדויים.</footer>
<div id="pop" hidden role="tooltip"></div>

<script>
const G={
 weak:["סימן חלש (Weak Signal)","שינוי קטן, חריגה או דפוס שעדיין אינם פער או כשל. לבדו נראה זניח; יחד עם אחרים הוא עשוי להצביע על סיכון מתהווה."],
 ew:["התרעה מוקדמת (Early Warning)","הודעה שנוצרת כשסימנים, פערים ושינויים מתחברים למשמעות אפשרית עבור המשימה, לפני שהכשל קרה."],
 change:["מה השתנה מאז הפעם הקודמת?","השאלה הקבועה של מודל המציאות. אבל שינוי אינו בהכרח שינוי במוכנות, ולכן כל שינוי נבדק מול המשימה."],
 hidden:["חולשה נסתרת","חולשה שאינה נראית בבדיקה רגילה: נקודת כשל יחידה, תלות משותפת, גיבוי מדומה, ריכוז ידע אצל אדם אחד, או צירוף של כמה חולשות קטנות."],
 falsered:["גיבוי מדומה (False Redundancy)","שתי מערכות שנראות כגיבוי זו לזו, אבל תלויות באותו רכיב. כשהרכיב נופל, שתיהן נופלות."],
 common:["תלות משותפת (Common Dependency)","רכיב אחד, אדם או ספק שכמה יכולות נשענות עליו. נקודת תורפה שנראית רק כשמחברים את המידע."],
 assumption:["הנחת יסוד","דבר שהתוכנית מניחה שהוא נכון בלי ראיה עדכנית. במודל, כל הנחה קריטית מסומנת ומקבלת מועד לבדיקה חוזרת."],
 aging:["התיישנות ראיה","ראיה שהייתה תקפה ואיבדה את תוקפה: עבר זמן, השתנו התנאים, או הוחלפה המערכת שנבדקה."],
 kg:["גרף ידע (Knowledge Graph)","ייצוג של הקשרים בין משימות, יכולות, דרישות, אנשים, מערכות, ראיות ופערים. ממצא של סוכן אחד הופך כך לקלט של האחרים."],
 breaking:["נקודת השבירה","התנאים שבהם יכולת עוברת מ'מוכנה' ל'לא מוכנה': כמה עומס, כמה חוסר, כמה זמן."],
 premortem:["Pre-Mortem","מניחים שהמשימה כבר נכשלה ושואלים: מה היה הסיפור? כך נחשפים כשלים שקשה להעלות כשמניחים הצלחה."],
 redteam:["צוות אדום של AI","סוכן שתפקידו לנסות להכשיל את התוכנית או את הערכת המוכנות, ולחפש דרכי כשל שאינן בתרחיש הבסיס."],
 chainbreak:["שבירת שרשרת הכשל","איתור הנקודה שבה התערבות אחת עוצרת התפתחות של כשל, ולעתים כמה מסלולי סיכון בבת אחת (נקודת מנוף)."],
 decay:["דעיכת ידע","ידע ומיומנות שלא תורגלו זמן רב נשחקים, גם אם ההכשרה רשומה כ'בוצעה'."],
 micro:["תרגיל זעיר (Micro-Drill)","תרגול קצר וממוקד, של דקות, שבודק השערה אחת במציאות או מרענן מיומנות שדועכת."],
 declared:["מוכנות מוצהרת","מוכנות שנשענת על דיווח או מסמך בלבד."],
 verified:["מוכנות מאומתת","מוכנות שנבדקה מול ראיות עדכניות ועקיבות."],

 ['hist','היסטוריה ולקחים','History & Lessons','בשלושת התרגילים הקודמים נרשמה ירידה בזמינות כוח האדם.'],
 ['plan','מתכנן','Planner','מאז הוספנו חמישה עובדים.'],
 ['crit','מבקר','Critic','נכון, אבל שניים מהם עדיין לא עברו הכשרה.'],
 ['arb','בורר','Arbitrator','הטענה "יש 20 עובדים" נכונה מבחינה כמותית, אבל אינה מוכיחה מוכנות מבצעית. הטענה של המבקר נשענת על ראיה מתרגיל; הטענה של המתכנן נשענת על תקן.']];
let dbStep=1;
V.debate=()=>`<p class="eyebrow">איך הסוכנים עובדים יחד</p><h1>ויכוח בין סוכנים</h1>
<p class="lead">סוכן אחד עלול לקבל את הנחות התוכנית ולנתח אותה מאותה נקודת מבט של הארגון. לכן, בהנחות קריטיות, המודל מפעיל ${T('debate','דיון רב־סוכנים')}: לכל סוכן אינטרס אחר, וההכרעה נשענת על ראיות, לא על מי שטען יפה יותר.</p>
<div class="grid4" style="margin-top:12px">
 <div class="panel"><b>מתכנן</b><p class="muted" style="margin:4px 0 0">לגרום למשימה להצליח</p></div>
 <div class="panel"><b>מבקר</b><p class="muted" style="margin:4px 0 0">למצוא איך היא תיכשל</p></div>
 <div class="panel"><b>היסטוריה ולקחים</b><p class="muted" style="margin:4px 0 0">לזכור מה כבר קרה</p></div>
 <div class="panel"><b>בורר</b><p class="muted" style="margin:4px 0 0">להכריע לפי ראיות</p></div>
</div>
<h2>דוגמה</h2>
<div>${DB.slice(0,dbStep).map(d=>`<div class="turn ${d[0]}"><span class="who2">${d[1]} · <span class="en" style="margin:0">${d[2]}</span></span><p>${d[3]}</p></div>`).join('')}</div>
<div class="ctrl"><button class="btn" type="button" id="dbNext" ${dbStep>=DB.length?'disabled':''}>התור הבא</button><button class="btn" type="button" id="dbReset">מההתחלה</button></div>
${dbStep>=DB.length?`<div class="alert"><div class="hd"><b>חבילת ההחלטה</b><span class="meta">Decision Package</span></div><ul>
<li>${L.ev} ${T('declared','מוכנות מוצהרת')}: גבוהה.</li>
<li>${L.inf} ${T('verified','מוכנות מאומתת')}: בינונית.</li>
<li>${L.ev} פער קריטי: זמינות של צוות מוכשר, לא מספר העובדים.</li>
<li>${L.un} מחלוקת שנותרה: אם שני העובדים החדשים יוכשרו לפני התרגיל הבא.</li>
<li>${L.rec} להשלים הכשרה לשניים ולבדוק בתרגיל.</li></ul></div>`:''}
<p style="margin-top:16px">המטרה אינה הסכמה בין הסוכנים. המטרה היא מסקנה שעומדת בביקורת. לעתים קרובות, דווקא המחלוקת שנותרה היא הדבר החשוב ביותר שהמנהל צריך לראות.</p>
${pager('debate')}`;

const WK=[
 ['ראשון',[['signals','סריקה יומית: זמן ההגעה של הכוננים בלילה עלה שוב, בשבוע השישי ברציפות. נרשם כמעקב.']]],
 ['שני',[['assumptions','ראיית התקינות של מערכת הקריאה פגה. ההנחה "80% בתוך 20 דקות" חוזרת לסטטוס "הנחה".'],['signals','שלושה סימנים באותה יכולת ובאותה משמרת. רמה עולה להתרעה.']]],
 ['שלישי',[['connect','דוח תחזוקה חדש נקלט. נמצא קשר בינו לבין חוזה הדלק ולסיכום התרגיל העירוני. נפתחה חולשה נסתרת.']]],
 ['רביעי',[['whatif','בעולם דווח על בית חולים שנותק מחשמל בסערה. נבחן התרחיש המקביל כאן. נמצאה נקודת שבירה משוערת.']]],
 ['חמישי',[['fix','מזהה הממצאים החוזרים מקשר את ממצאי השבוע לממצא מ־2023, 2024 ו־2026. מוצעת נקודת מנוף אחת.'],['fix','מאמן המוכנות שולח לשתי אחראיות משמרת תרגול זעיר של 5 דקות בטריאז\' המוני.']]],
 ['שישי',[['assumptions','סיכום שבועי למנהלת אר"ן: שלוש החלטות ממתינות, כל אחת עם ראיות, רמת ביטחון ומחיר.']]],
];
V.week=()=>`<p class="eyebrow">איך הסוכנים עובדים יחד</p><h1>שבוע אחד, בלי שמישהו ביקש</h1>
<p class="lead">כך נראה שבוע של סוכנים יזומים בבית החולים. אף אחת מהפעולות לא התחילה מבקשה. כולן התחילו מנתון, מתאריך או מאירוע.</p>
<div class="week">${WK.map(d=>`<div class="day"><span class="d">${d[0]}</span><div>${d[1].map(e=>{const a=A.find(x=>x.id===e[0]);return `<p class="ev"><a class="chip" href="#${a.id}">${a.n}. ${a.short}</a> ${e[1]}</p>`}).join('')}</div></div>`).join('')}</div>
<p style="margin-top:16px">מה לא קרה השבוע: הסוכנים לא שינו נוהל, לא הזיזו משמרת ולא סגרו פער. הם הביאו לשולחן שלוש החלטות שאחרת היו מתגלות, אולי, בתחקיר.</p>
${pager('week')}`;

V.guard=()=>`<p class="eyebrow">גבולות</p><h1>יוזמה בלי השתלטות</h1>
<p class="lead">סוכן יזום הוא כלי חזק, ולכן הגבולות שלו צריכים להיות ברורים במיוחד. היוזמה היא בחיפוש, בחיבור ובשאלה. ההחלטה נשארת אצל אדם.</p>
<h2>ארבעה דברים שהסוכן לא עושה</h2>
<div class="rule"><span class="k">1</span><div><b>לא קובע לבדו שהארגון מוכן.</b> מוכנות קריטית מחייבת ראיה, אימות וסמכות אנושית.</div></div>
<div class="rule"><span class="k">2</span><div><b>לא הופך השערה לעובדה.</b> כל היסק של AI מסומן כהיסק.</div></div>
<div class="rule"><span class="k">3</span><div><b>לא הופך תרחיש לניבוי.</b> תרחיש בוחן עמידות. הוא אינו תחזית.</div></div>
<div class="rule"><span class="k">4</span><div><b>לא מחליף אחריות פיקודית.</b> הוא מספק מודיעין ותמיכה בהחלטה. הסמכות והאחריות אנושיות.</div></div>
<h2>כל פריט מסומן</h2>
<p>${L.ev} נשען על מקור, תאריך ותנאים. ${L.inf} מסקנה של המערכת. ${L.as} נכון לפי התוכנית, ולא נבדק לאחרונה. ${L.un} אין מספיק מידע. ${L.rec} הצעה לפעולה, שממתינה להחלטה.</p>
<h2>סולם ההסלמה</h2>
<p>כדי לא להציף, לא כל ממצא הופך להתרעה. הסוכן מדרג, ומי שמקבל את ההודעה משתנה לפי הרמה.</p>
<div class="ladder">
 <div style="border-top-color:var(--line)"><b>סימן</b><p>נרשם בתמונה החיה. אינו נשלח לאיש.</p></div>
 <div style="border-top-color:var(--accent)"><b>מעקב</b><p>נשלח לבעל התפקיד בסיכום התקופתי.</p></div>
 <div style="border-top-color:var(--warn)"><b>התרעה</b><p>נשלחת לבעל התפקיד מיד, עם בקשה להחלטה.</p></div>
 <div style="border-top-color:var(--bad)"><b>התרעה דחופה</b><p>משימה קריטית בסיכון ממשי. עולה לדרג הבכיר.</p></div>
</div>
<h2>בקרה על הסוכנים עצמם</h2>
<ul>
<li><b>עקיבות.</b> כל פעולה יזומה משאירה עקבה: מה הפעיל אותה, על מה נשענה ומה הוצע.</li>
<li><b>זכות לומר "לא".</b> אדם רשאי לדחות כל התרעה. הנימוק נשמר, והסוכן לומד ממנו.</li>
<li><b>${T('meta','בדיקה עצמית')}.</b> שכבת־העל בודקת את המסקנות של הסוכנים: על אילו הנחות נשענו ומה עלול להפריך אותן.</li>
<li><b>מדידת רעש.</b> כמה התרעות נדחו, וכמה התבררו כנכונות. סוכן שמציף מאבד את אמון האנשים, ואיתו את ערכו.</li>
</ul>
<p class="pq">ה־AI מזהה, מחבר, מאתגר, חוקר וממליץ.<br>האדם מפרש, מאמת, מחליט ונושא באחריות.</p>
${pager('guard')}`;

V.glossary=()=>`<p class="eyebrow">מילון</p><h1>מושגים בדף</h1><p class="lead">בכל הדפים, מושג מסומן בקו מנוקד מציג את הגדרתו בלחיצה. כאן הם מרוכזים.</p>
<dl class="gloss">${Object.values(G).map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl>${pager('glossary')}`;

const nav=document.getElementById('navlist');
nav.innerHTML=`<li><a href="#overview"><span class="code">◎</span>תמונת העל</a></li><li class="navgroup">חמש הפעולות היזומות</li><li class="sub"><ul class="navlist">${A.map(a=>`<li><a href="#${a.id}"><span class="code">0${a.n}</span>${a.name}</a></li>`).join('')}</ul></li>
<li class="navgroup">איך הסוכנים עובדים יחד</li><li><a href="#roster"><span class="code">⌘</span>מפת הסוכנים</a></li><li><a href="#chain"><span class="code">⇢</span>תגובת שרשרת</a></li><li><a href="#debate"><span class="code">⇄</span>ויכוח בין סוכנים</a></li><li><a href="#week"><span class="code">◷</span>שבוע אחד</a></li>
<li class="navgroup">גבולות</li><li><a href="#guard"><span class="code">◐</span>גבולות ובקרה</a></li><li><a href="#glossary"><span class="code">§</span>מילון</a></li>`;

const view=document.getElementById('view');
function route(scroll=true){
 let h=(location.hash||'#overview').slice(1); if(!V[h]) h='overview';
 view.innerHTML=V[h]();
 nav.querySelectorAll('a').forEach(a=>a.getAttribute('href')==='#'+h?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 hidePop();
 view.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{filt=b.dataset.f||null;route(false);}));
 const on=(id,f)=>{const el=document.getElementById(id);if(el)el.addEventListener('click',()=>{f();route(false);});};
 on('chNext',()=>chStep=Math.min(CH.length,chStep+1));on('chAll',()=>chStep=CH.length);on('chReset',()=>chStep=1);
 on('dbNext',()=>dbStep=Math.min(DB.length,dbStep+1));on('dbReset',()=>dbStep=1);
 if(scroll&&location.hash){view.focus({preventScroll:true});view.scrollIntoView({block:'start'});}
}
const pop=document.getElementById('pop');
function hidePop(){pop.hidden=true;}
document.addEventListener('click',e=>{const t=e.target.closest('.term');if(!t){if(!e.target.closest('#pop'))hidePop();return;}
 const [n,d]=G[t.dataset.k];pop.innerHTML=`<b>${n}</b>${d}`;pop.hidden=false;
 const r=t.getBoundingClientRect(),w=Math.min(320,innerWidth-24);pop.style.maxWidth=w+'px';
 let x=Math.min(Math.max(12,r.right-w),innerWidth-w-12),y=r.bottom+8;if(y+pop.offsetHeight>innerHeight-12)y=r.top-pop.offsetHeight-8;
 pop.style.left=x+'px';pop.style.top=Math.max(12,y)+'px';});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePop();});
addEventListener('scroll',hidePop,{passive:true});
const tg=document.getElementById('navtoggle');
tg.addEventListener('click',()=>{const open=nav.classList.toggle('closed')===false;tg.setAttribute('aria-expanded',open);tg.textContent=open?'הסתר את תוכן העניינים':'הצג את תוכן העניינים';});
nav.addEventListener('click',e=>{if(e.target.closest('a')&&innerWidth<=860){nav.classList.add('closed');tg.setAttribute('aria-expanded','false');tg.textContent='הצג את תוכן העניינים';}});
document.documentElement.dir='rtl';document.documentElement.lang='he';
addEventListener('hashchange',()=>route());route();
</script>

</body>
</html>
